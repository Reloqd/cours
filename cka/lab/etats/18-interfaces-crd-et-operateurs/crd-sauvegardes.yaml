apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sauvegardes.boutique.example
spec:
  group: boutique.example
  scope: Namespaced
  names:
    kind: Sauvegarde
    listKind: SauvegardeList
    plural: sauvegardes
    singular: sauvegarde
    shortNames:
    - svg
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Cible
      type: string
      jsonPath: .spec.cible
    - name: Planification
      type: string
      jsonPath: .spec.planification
    - name: Retention
      type: integer
      jsonPath: .spec.retention
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - cible
            properties:
              cible:
                type: string
              planification:
                type: string
              retention:
                type: integer
                minimum: 1
                maximum: 30
          status:
            type: object
            properties:
              derniereExecution:
                type: string
                format: date-time
