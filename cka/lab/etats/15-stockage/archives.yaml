# Volume local statique sur cka-m02 (/mnt/archives, créé par appliquer.sh).
# PVC recréée en fin de chapitre avec volumeName : liée sans pod consommateur.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manuel
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: archives
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manuel
  local:
    path: /mnt/archives
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - cka-m02
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archives
  namespace: boutique
spec:
  storageClassName: manuel
  volumeName: archives
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
