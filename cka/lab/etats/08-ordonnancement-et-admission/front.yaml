apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: boutique
  labels:
    app: front
    tier: web
  annotations:
    kubernetes.io/change-cause: "montage des ConfigMaps front-html et front-conf"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: front
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: front
        tier: web
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: front
      containers:
      - name: nginx
        image: nginx:1.30.6-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: html
        configMap:
          name: front-html
      - name: conf
        configMap:
          name: front-conf
