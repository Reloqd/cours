apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployeur
  namespace: boutique
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployeur
  namespace: boutique
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployeur
  namespace: boutique
subjects:
- kind: ServiceAccount
  name: deployeur
  namespace: boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployeur
