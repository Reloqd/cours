apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developpeur
  namespace: boutique
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developpeurs
  namespace: boutique
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: developpeurs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developpeur
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lecteur-noeuds
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lecteur-noeuds-alice
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: alice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lecteur-noeuds
