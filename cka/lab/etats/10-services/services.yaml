apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: boutique
  labels:
    app: api
    tier: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: boutique
  labels:
    app: front
    tier: web
spec:
  type: NodePort
  selector:
    app: front
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: front-lb
  namespace: boutique
  labels:
    app: front
    tier: web
spec:
  type: LoadBalancer
  selector:
    app: front
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
---
# Service headless : un enregistrement DNS par pod prêt.
apiVersion: v1
kind: Service
metadata:
  name: api-pods
  namespace: boutique
  labels:
    app: api
    tier: api
spec:
  clusterIP: None
  selector:
    app: api
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: meteo
  namespace: boutique
spec:
  type: ExternalName
  externalName: example.com
