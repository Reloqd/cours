apiVersion: v1
kind: ConfigMap
metadata:
  name: front-html-v2
  namespace: boutique
data:
  index.html: |
    <h1>Boutique</h1><p>v2</p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-v2
  namespace: boutique
  labels:
    app: front-v2
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-v2
  template:
    metadata:
      labels:
        app: front-v2
        tier: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.30.6-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: front-html-v2
---
apiVersion: v1
kind: Service
metadata:
  name: front-v2
  namespace: boutique
  labels:
    app: front-v2
    tier: web
spec:
  selector:
    app: front-v2
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
