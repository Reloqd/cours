apiVersion: v1
kind: ConfigMap
metadata:
  name: front-html
  namespace: boutique
data:
  index.html: |
    <h1>Boutique</h1><p>v1</p>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: front-conf
  namespace: boutique
data:
  default.conf: |
    server {
        listen 80;
        location / { root /usr/share/nginx/html; }
        location /api/ { proxy_pass http://api:8080/; }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: boutique
data:
  APP_MODE: production
  LOG_LEVEL: info
