apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: boutique
  labels:
    app: front
    tier: web
  annotations:
    kubernetes.io/change-cause: "image nginx:1.30.6-alpine"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: front
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: front
        tier: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.30.6-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
