# Équivalents de « kubectl expose deployment api --port=8080 » et
# « kubectl expose deployment front --port=80 » (complétés au chapitre 10).
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: boutique
  labels:
    app: api
    tier: api
spec:
  selector:
    app: api
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: boutique
  labels:
    app: front
    tier: web
spec:
  selector:
    app: front
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
