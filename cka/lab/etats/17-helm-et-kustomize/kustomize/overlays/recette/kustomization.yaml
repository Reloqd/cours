apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-recette
resources:
- namespace.yaml
- ../../base
labels:
- pairs:
    env: recette
  includeTemplates: true
replicas:
- name: front
  count: 1
configMapGenerator:
- name: front-html
  behavior: replace
  files:
  - index.html
